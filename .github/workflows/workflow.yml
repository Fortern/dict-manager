name: Build Docker Image
run-name: Building Docker Image 🚀
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build with Go and Upload
    runs-on: ubuntu-latest
    env:
      BINARY_PATH: build/dict-manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install musl toolchain
        run: |
          sudo apt update
          sudo apt install --yes --no-install-recommends musl-tools

      - name: Build static Linux binary
        env:
          CC: musl-gcc
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p build
          go get dict-manager
          go build \
            -tags sqlite_omit_load_extension \
            -trimpath \
            -buildvcs=false \
            -ldflags='-s -buildid= -linkmode external -extldflags "-static"' \
            -o "$BINARY_PATH" \
            .
          ls -lh "$BINARY_PATH"
          file "$BINARY_PATH"
          if readelf -l "$BINARY_PATH" | grep -q 'INTERP'; then
            echo "::error::binary contains a dynamic program interpreter"
            exit 1
          fi
          if readelf -d "$BINARY_PATH" | grep -q 'NEEDED'; then
            echo "::error::binary contains dynamic library dependencies"
            exit 1
          fi

      - name: Determine image version
        id: set-version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_NAME }}/dict-manager:latest
            ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_NAME }}/dict-manager:${{ steps.set-version.outputs.version }}
